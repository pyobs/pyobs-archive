[project]
name = "pyobs-archive"
version = "1.2"
description = "A webservice for an archive for astronomical images."
requires-python = ">=3.11"
dependencies = [
    "astropy>=6.1",
    "Django>=4.2,<5",
    "django-oauth-toolkit>=2.4.0,<3",
    "djangorestframework>=3.15",
    "gunicorn>=23.0.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "psycopg2-binary>=2.9",
    "zipstream>=1.1.4",
    "django-crispy-forms>=2.3",
    "django-cors-headers>=4.4",
]

[tool.uv]
package = false
